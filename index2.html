           6. محرك المؤثرات الصوتية (Web Audio API بدون روابط خارجية)
           ============================================================================ */
        const SoundFX = {
            ctx: null,
            ensure() {
                if (!APP_STATE.soundEnabled) return null;
                try {
                    if (!this.ctx) {
                        const AC = window.AudioContext || window.webkitAudioContext;
                        if (AC) this.ctx = new AC();
                    }
                    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
                    return this.ctx;
                } catch (e) { return null; }
            },
            tone(freq, dur, type, vol, delay = 0) {
                const c = this.ensure();
                if (!c) return;
                try {
                    const o = c.createOscillator();
                    const g = c.createGain();
                    o.type = type || 'sine';
                    o.frequency.setValueAtTime(freq, c.currentTime + delay);
                    g.gain.setValueAtTime(vol || 0.06, c.currentTime + delay);
                    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + delay + dur);
                    o.connect(g);
                    g.connect(c.destination);
                    o.start(c.currentTime + delay);
                    o.stop(c.currentTime + delay + dur);
                } catch (e) {}
            },
            click() { this.tone(540, 0.055, 'triangle', 0.04); },
            success() {
                this.tone(523.25, 0.14, 'sine', 0.07, 0);
                this.tone(659.25, 0.14, 'sine', 0.07, 0.09);
                this.tone(783.99, 0.22, 'sine', 0.08, 0.18);
            },
            error() {
                this.tone(220, 0.16, 'sawtooth', 0.045, 0);
                this.tone(175, 0.2, 'sawtooth', 0.045, 0.11);
            }
        };

        /* ============================================================================
           7. محرك المؤثرات البصرية (خلفية الجزيئات + الشرارات + Confetti + XP طائر)
           ============================================================================ */
        const VisualFX = {
            canvas: null, ctx: null, nodes: [], formulas: [], confetti: [],
            mouse: { x: -999, y: -999 }, raf: null,
            init() {
                this.canvas = document.getElementById('chemCanvas');
                if (!this.canvas) return;
                this.ctx = this.canvas.getContext('2d');
                this.resize();
                window.addEventListener('resize', () => this.resize());
                window.addEventListener('mousemove', e => { this.mouse.x = e.clientX; this.mouse.y = e.clientY; });
                window.addEventListener('touchmove', e => {
                    if (e.touches && e.touches[0]) { this.mouse.x = e.touches[0].clientX; this.mouse.y = e.touches[0].clientY; }
                }, { passive: true });
                document.addEventListener('pointerdown', e => {
                    if (APP_STATE.fxEnabled) this.tapSparks(e.clientX, e.clientY);
                });
                const syms = ['H₂O', 'PV=nRT', 'ΔH', 'Ksp', 'pH', 'Cu²⁺', 'NH₃', 'Z=1', 'π=cRT'];
                this.formulas = syms.map(s => ({
                    text: s,
                    x: Math.random() * window.innerWidth,
                    y: Math.random() * window.innerHeight,
                    vy: -0.18 - Math.random() * 0.22,
                    vx: (Math.random() - 0.5) * 0.15
                }));
                this.seedNodes();
                this.loop();
            },
            resize() {
                if (!this.canvas) return;
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
                this.seedNodes();
            },
            seedNodes() {
                const count = window.innerWidth < 640 ? 22 : 42;
                this.nodes = Array.from({ length: count }, () => ({
                    x: Math.random() * this.canvas.width,
                    y: Math.random() * this.canvas.height,
                    vx: (Math.random() - 0.5) * 0.45,
                    vy: (Math.random() - 0.5) * 0.45,
                    r: 1.8 + Math.random() * 2.2
                }));
            },
            tapSparks(x, y) {
                const colors = ['#22d3ee', '#818cf8', '#34d399', '#fbbf24'];
                for (let i = 0; i < 6; i++) {
                    const el = document.createElement('span');
                    el.className = 'tap-spark';
                    const angle = (Math.PI * 2 * i) / 6 + Math.random() * 0.4;
                    const dist = 18 + Math.random() * 22;
                    el.style.left = x + 'px';
                    el.style.top = y + 'px';
                    el.style.background = colors[i % colors.length];
                    el.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
                    el.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
                    document.body.appendChild(el);
                    setTimeout(() => el.remove(), 580);
                }
            },
            burstConfetti() {
                if (!APP_STATE.fxEnabled || !this.canvas) return;
                const colors = ['#22d3ee', '#34d399', '#fbbf24', '#818cf8', '#f472b6'];
                for (let i = 0; i < 42; i++) {
                    this.confetti.push({
                        x: this.canvas.width / 2,
                        y: this.canvas.height * 0.35,
                        vx: (Math.random() - 0.5) * 9,
                        vy: -4 - Math.random() * 6,
                        size: 4 + Math.random() * 4,
                        color: colors[i % colors.length],
                        life: 1
                    });
                }
            },
            floatXP(text) {
                if (!APP_STATE.fxEnabled) return;
                const el = document.createElement('div');
                el.className = 'xp-float text-emerald-400 text-lg drop-shadow-lg';
                el.style.left = '50%';
                el.style.top = '42%';
                el.textContent = '✨ ' + text;
                document.body.appendChild(el);
                setTimeout(() => el.remove(), 1200);
            },
            loop() {
                if (APP_STATE.fxEnabled && this.ctx) {
                    const ctx = this.ctx;
                    const w = this.canvas.width, h = this.canvas.height;
                    ctx.clearRect(0, 0, w, h);
                    const isDark = APP_STATE.theme === 'dark';

                    ctx.font = '700 11px "JetBrains Mono", monospace';
                    ctx.fillStyle = isDark ? 'rgba(56, 189, 248, 0.14)' : 'rgba(14, 116, 144, 0.12)';
                    this.formulas.forEach(f => {
                        f.y += f.vy; f.x += f.vx;
                        if (f.y < -20) { f.y = h + 20; f.x = Math.random() * w; }
                        ctx.fillText(f.text, f.x, f.y);
                    });

                    for (let i = 0; i < this.nodes.length; i++) {
                        const a = this.nodes[i];
                        a.x += a.vx; a.y += a.vy;
                        if (a.x < 0 || a.x > w) a.vx *= -1;
                        if (a.y < 0 || a.y > h) a.vy *= -1;

                        const dm = Math.hypot(a.x - this.mouse.x, a.y - this.mouse.y);
                        if (dm < 110) {
                            ctx.beginPath();
                            ctx.moveTo(a.x, a.y);
                            ctx.lineTo(this.mouse.x, this.mouse.y);
                            ctx.strokeStyle = isDark ? 'rgba(34,211,238,0.22)' : 'rgba(14,116,144,0.18)';
                            ctx.stroke();
                        }

                        ctx.beginPath();
                        ctx.arc(a.x, a.y, a.r, 0, Math.PI * 2);
                        ctx.fillStyle = isDark ? 'rgba(56,189,248,0.45)' : 'rgba(2,132,199,0.28)';
                        ctx.fill();

                        for (let j = i + 1; j < this.nodes.length; j++) {
                            const b = this.nodes[j];
                            const d = Math.hypot(a.x - b.x, a.y - b.y);
                            if (d < 105) {
                                ctx.beginPath();
                                ctx.moveTo(a.x, a.y);
                                ctx.lineTo(b.x, b.y);
                                ctx.strokeStyle = isDark
                                    ? `rgba(99,102,241,${0.18 * (1 - d / 105)})`
                                    : `rgba(79,70,229,${0.12 * (1 - d / 105)})`;
                                ctx.stroke();
                            }
                        }
                    }

                    this.confetti = this.confetti.filter(p => p.life > 0);
                    this.confetti.forEach(p => {
                        p.x += p.vx; p.y += p.vy; p.vy += 0.22; p.life -= 0.018;
                        ctx.globalAlpha = Math.max(0, p.life);
                        ctx.fillStyle = p.color;
                        ctx.fillRect(p.x, p.y, p.size, p.size * 0.7);
                        ctx.globalAlpha = 1;
                    });
                }
                this.raf = requestAnimationFrame(() => this.loop());
            }
        };
